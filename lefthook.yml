pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{css,js,json,jsonc,jsx,md,ts,tsx,yaml,yml}"
      exclude:
        - "**/package-lock.json"
      run: npm run format:check:files -- {staged_files}
    - name: lint
      glob:
        - "src/*.{js,jsx,ts,tsx,cjs,cts,mts}"
        - "src/**/*.{js,jsx,ts,tsx,cjs,cts,mts}"
        - "vite.config.ts"
        - "drizzle.config.ts"
      run: npm run lint
    - name: lint-strict
      glob: "*.{ts,tsx}"
      run: npm run lint:strict -- --staged {staged_files}
    - name: typecheck
      run: npm run typecheck
